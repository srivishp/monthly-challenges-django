<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Challenges</title>
</head>
<body>
    <ul>
        {% for month in months %}
        {% comment %}
        # Dynamic URL in the template can be done using the url tag
        {% endcomment %}
        <li>
            <a href="{% url 'month-challenge' month %}"> {{month | title}}
            </a>
        </li>
        {% endfor %}
    </ul>
    {% comment %}
    We can use {% for %} {business_logic} {% end for %}
    to implement the logic in the template
    {% endcomment %}
</body>
</html>
